# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 8 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPss
  m: [0.67, 0.75, 768] # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512] # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512] # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs
channels: 6
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-3, 1, TextureInference, [1]] # 0

  # RGB
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 3, C2f, [128, True]] #3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8

  # IR
  - [-4, 1, Conv, [64, 3, 2]] # 5 -4表示跳转分支
  - [-1, 1, Conv, [128, 3, 2]] # 6
  - [-1, 3, C2f, [128, True]] # 7
  - [-1, 1, Conv, [256, 3, 2]] # 8  ir p3

  # Fusion Stage 1 (P3)
  - [-3, 1, TIDE, [256, 4]] # 9

  # RGB
  - [-4, 6, C2f, [256, True]] #10 256 
  - [-1, 1, Conv, [512, 3, 2]] # 11 rgb p4
 
  # IR
  - [-4, 6, C2f, [256, True]] # 12
  - [-1, 1, Conv, [512, 3, 2]] # 13 ir p4

  # Fusion Stage 2 (P4)
  - [-3, 1, TIDE, [512, 4]] # 14 

  # RGB
  - [-4, 6, C2f, [512, True]] #15
  - [-1, 1, Conv, [1024, 3, 2]] # 16  rgb p5

  # IR
  - [-4, 6, C2f, [512, True]] #17
  - [-1, 1, Conv, [1024, 3, 2]] # 18  ir p5

  # Fusion Stage 3 (P5)
  - [-3, 1, TIDE, [1024, 4]] # 19 

  # RGB
  - [-4, 3, C2f, [1024, True]] #20
  - [-1, 1, SPPF, [1024, 5]] # 21

  # IR
  - [-4, 3, C2f, [1024, True]] #22
  - [-1, 1, SPPF, [1024, 5]] # 23

  
# YOLOv8.0n head
head:
#rgb 10 15 21 
#ir 12 17 23
  
#rgb
  - [21, 1, nn.Upsample, [None, 2, "nearest"]] #24
  - [[-1, 15], 1, Concat, [1]] # 25
  - [-1, 3, C2f, [512]] # 26

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #27
  - [[-1, 10], 1, Concat, [1]] # 28
  - [-1, 3, C2f, [256]] # 29

  - [-1, 1, Conv, [256, 3, 2]] #30
  - [[-1, 26], 1, Concat, [1]] # 31
  - [-1, 3, C2f, [512]] # 32

  - [-1, 1, Conv, [512, 3, 2]] # 33
  - [[-1, 21], 1, Concat, [1]] # 34
  - [-1, 3, C2f, [1024]] # 35

#ir
  - [23, 1, nn.Upsample, [None, 2, "nearest"]] #36
  - [[-1, 17], 1, Concat, [1]] # 37
  - [-1, 3, C2f, [512]] # 38

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #39
  - [[-1, 12], 1, Concat, [1]] # 40
  - [-1, 3, C2f, [256]] # 41

  - [-1, 1, Conv, [256, 3, 2]] #42
  - [[-1, 38], 1, Concat, [1]] # 43
  - [-1, 3, C2f, [512]] # 44

  - [-1, 1, Conv, [512, 3, 2]] # 45
  - [[-1, 23], 1, Concat, [1]] # 46
  - [-1, 3, C2f, [1024]] # 47

  - [[29,41], 1, FSCF, [1]] # 48
  - [[32,44], 1, FSCF, [1]] # 49
  - [[35,47], 1, FSCF, [1]] # 50

  - [[32, 35, 38], 1, OBB, [nc, 1]] # 51
