# Ultralytics YOLO 🚀, AGPL-3.0 license
# COCO8 dataset (first 8 images from COCO train2017) by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/detect/coco8/
# Example usage: yolo train data=coco8.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco8  ← downloads here (1 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]

train: /home/datasets/VEDAI/images/train # train images (relative to 'path') 4 images
val: /home/datasets/VEDAI/images/val  # val images (relative to 'path') 4 images
test: /home/datasets/VEDAI/images/test
train_ir: /home/datasets/VEDAI/images_ir/train # train images (relative to 'path') 4 image
val_ir: /home/datasets/VEDAI/images_ir/val  # val images (relative to 'path') 4 images
test_ir: /home/datasets/VEDAI/images_ir/test


names:
  0: car
  1: pickup
  2: truck
  3: camping
  4: boat
  5: tractor
  6: van
  7: other

